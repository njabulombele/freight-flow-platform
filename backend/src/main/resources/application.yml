spring:
  application:
    name: freightflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:freightflow}
    username: ${DB_USER:freightflow}
    password: ${DB_PASSWORD:freightflow}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: freightflow
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.freightflow.*"

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${BACKEND_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24=}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  prediction:
    service-url: ${PREDICTION_SERVICE_URL:http://localhost:8000}
  messaging:
    # Set to false to disable Kafka (outbox relay and event consumers).
    # Kafka must be running (docker compose --profile kafka up) for this to be true.
    kafka-enabled: ${KAFKA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: freightflow-backend

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [tenant=%X{tenantId},traceId=%X{traceId},spanId=%X{spanId}]"
  level:
    com.freightflow: INFO
    org.springframework.security: INFO
