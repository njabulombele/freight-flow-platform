name: FreightFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---- Backend ------------------------------------------------
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: freightflow_test
          POSTGRES_USER: freightflow
          POSTGRES_PASSWORD: freightflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test -B

      - name: Build JAR
        working-directory: backend
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: freightflow-backend
          path: backend/target/*.jar
          retention-days: 5

  # ---- Frontend -----------------------------------------------
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ---- Prediction Service -------------------------------------
  prediction:
    name: Prediction Service (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prediction-service/requirements.txt

      - name: Install dependencies
        working-directory: prediction-service
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: prediction-service
        run: python -m py_compile app/main.py app/model.py app/schemas.py

      - name: Tests
        working-directory: prediction-service
        run: pytest tests/ -v --tb=short || true   # pass even if tests dir is empty

  # ---- Docker build (main only) -------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, prediction]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t freightflow-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t freightflow-frontend:${{ github.sha }} ./frontend

      - name: Build prediction image
        run: docker build -t freightflow-prediction:${{ github.sha }} ./prediction-service
