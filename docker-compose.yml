# Lightweight local development infrastructure.
# Start with Postgres + Redis, introduce Kafka incrementally.
#
#   docker compose up -d postgres redis          # minimal
#   docker compose up -d                          # includes Kafka + Zookeeper
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: freightflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freightflow}
      POSTGRES_USER: ${POSTGRES_USER:-freightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freightflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: freightflow-zookeeper
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: freightflow-kafka
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"

volumes:
  postgres_data:
  redis_data:
